name: agent-farm
x-service-base:
  restart: unless-stopped
  env_file: ../../.env
  networks: &id001
  - farmnet
  - agentfarm-supabase_default
  - workernet
  logging: &id002
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  litellm:
    restart: unless-stopped
    env_file: ../../.env
    networks: *id001
    logging: *id002
    image: ghcr.io/berriai/litellm-database:main-stable
    command:
    - --config
    - /app/config.yaml
    - --port
    - '4000'
    volumes:
    - ../litellm/config.yaml:/app/config.yaml:ro
    # POZOR: sem NEPATRI `KLIC: ${KLIC}`.
    #
    # `environment:` interpoluje compose CLI z `.env` v adresari compose souboru
    # (tedy infra/compose/), kde zadny neni — a prazdna hodnota z `environment:`
    # PREBIJE spravnou hodnotu z `env_file` niz. Kdyz se sluzba takhle pretvori,
    # LiteLLM prijde o master klic i o klice poskytovatelu a kazde volani konci
    # 401. Stalo se to 3. 9. 2026 a projevilo se to az za dva dny jako churn,
    # protoze chyba jde jen do stdout kontejneru.
    #
    # Klice dodava `env_file: ../../.env`. DATABASE_URL smi zustat, protoze
    # zadnou interpolaci nepouziva.
    environment:
      DATABASE_URL: postgresql://supabase_admin:afe4162c061d3de4134bd45d6ca1a9fa160c9af5912ac855@agentfarm-supabase-db-1:5432/litellm
    ports:
    - 127.0.0.1:4000:4000
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    networks:
    - farmnet
    - agentfarm-supabase_default
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      EXEC: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
  orchestrator:
    restart: unless-stopped
    env_file: ../../.env
    networks:
    - farmnet
    - workernet
    - agentfarm-supabase_default
    logging: *id002
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: orchestrator
    depends_on:
    - litellm
    - docker-socket-proxy
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
    - /var/lib/agent-farm/workspaces:/var/lib/agent-farm/workspaces
  publisher:
    restart: unless-stopped
    env_file: ../../.env
    networks: *id001
    logging: *id002
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: publisher
    depends_on:
    - litellm
  media-pipeline:
    restart: unless-stopped
    env_file: ../../.env
    networks: *id001
    logging: *id002
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: media-pipeline
    depends_on:
    - litellm
    volumes:
    - media-tmp:/tmp/media
  telegram-bot:
    restart: unless-stopped
    env_file: ../../.env
    networks: *id001
    logging: *id002
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: telegram-bot
    depends_on:
    - orchestrator
  dashboard:
    restart: unless-stopped
    env_file: ../../.env
    networks:
    - farmnet
    - agentfarm-supabase_default
    - workernet
    - dokploy-network
    logging: *id002
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    depends_on:
    - orchestrator
    container_name: agentfarm-dashboard
    expose:
    - '3000'
    environment:
      HOSTNAME: 0.0.0.0
      PORT: '3000'
networks:
  farmnet:
    driver: bridge
  workernet:
    name: workernet
    driver: bridge
  agentfarm-supabase_default:
    external: true
  dokploy-network:
    external: true
volumes:
  workspaces: null
  media-tmp: null
