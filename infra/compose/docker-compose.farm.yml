name: agent-farm
x-service-base:
  restart: unless-stopped
  env_file: ../../.env
  networks: &id001
  - farmnet
  - agentfarm-supabase_default
  - workernet
  logging: &id002
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  litellm:
    restart: unless-stopped
    env_file: ../../.env
    networks: *id001
    logging: *id002
    image: agent-farm-litellm:budgeted-20260916
    command:
    - --config
    - /app/config.yaml
    - --port
    - '4000'
    volumes:
    - ../litellm/config.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:?LITELLM_DATABASE_URL chybí v .env}
      # Strop trvání streamu v LiteLLM 1.95. POZOR na jeho hranice (ověřeno ve
      # streaming_handler.py nasazeného obrazu): kontroluje se jen NA ZAČÁTKU
      # __anext__, a uvnitř se čeká v `async for chunk in ...`, kde se prázdné
      # chunky přeskakují. Stream, který posílá pouze keepalive, se tedy do
      # kontroly nikdy nevrátí — stejně jako ho nezastaví `timeout`/`stream_timeout`,
      # které měří jen nečinnost mezi čteními a keepalive je nuluje. Bezpečně tedy
      # ohraničí jen stream, který nějaké chunky posílá; visící požadavek ukončí až
      # wall-clock pokusu (ATTEMPT_WALL_CLOCK_MIN). Jeho rezervaci proto po
      # STALE_RESERVATION_SECONDS uklidí hlídač sám (farm_budget_guard.py).
      LITELLM_MAX_STREAMING_DURATION_SECONDS: '600'
    ports:
    - 127.0.0.1:4000:4000
    build:
      context: ../litellm
      dockerfile: Dockerfile.budgeted
      args:
        LITELLM_BASE_IMAGE: ghcr.io/berriai/litellm-database@sha256:af7ff0444278be40f7615764d1562ac557df6103cba052e886915a7e1e944c27
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    networks:
    - farmnet
    - agentfarm-supabase_default
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      EXEC: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
  orchestrator:
    restart: unless-stopped
    env_file: ../../.env
    networks:
    - farmnet
    - workernet
    - agentfarm-supabase_default
    logging: *id002
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: orchestrator
    depends_on:
    - litellm
    - docker-socket-proxy
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      FARM_BUDGET_GUARD_REQUIRED: 'true'
      FARM_DAILY_CAP_USD: '0.60'
      MAX_WORKERS_TOTAL: '1'
      MAX_BEST_OF_N: '1'
      REFILL_MAX_ROUNDS_PER_DAY: '1'
      REFILL_MAX_TASKS_PER_ROUND: '2'
    volumes:
    - /var/lib/agent-farm/workspaces:/var/lib/agent-farm/workspaces
  publisher:
    restart: unless-stopped
    env_file: ../../.env
    networks: *id001
    logging: *id002
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: publisher
    depends_on:
    - litellm
  media-pipeline:
    restart: unless-stopped
    env_file: ../../.env
    networks: *id001
    logging: *id002
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: media-pipeline
    depends_on:
    - litellm
    volumes:
    - media-tmp:/tmp/media
  telegram-bot:
    restart: unless-stopped
    env_file: ../../.env
    networks: *id001
    logging: *id002
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: telegram-bot
    depends_on:
    - orchestrator
  dashboard:
    restart: unless-stopped
    # Dashboard ZÁMĚRNĚ nemá `env_file: ../../.env` — jinak by do procesu
    # webového serveru teklo všechno (GITHUB_ADMIN_PAT, DEEPSEEK_API_KEY,
    # LITELLM_MASTER_KEY, DATABASE_URL, Stripe…). Předáváme jen to, co kód
    # dashboardu skutečně čte (ověřeno grepem `process.env.` v apps/dashboard/src
    # a v runtime importech @farm/core; @farm/db se importuje jen jako typy).
    # FARM_* a MAX_WORKERS_TOTAL sem nepatří: autoritativní je farm_settings v DB.
    #
    # Interpolaci `${…}` dělá compose CLI, ne kontejner: hodnoty bere z
    # `--env-file` (produkce: explicitní cesta k .env), jinak z `.env` v adresáři
    # projektu (infra/compose/), kde žádný není. `:?` proto shodí `up` hned,
    # místo aby se dashboard tiše rozjel s prázdnými klíči (viz výpadek 3. 9. 2026).
    environment:
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      # Časy se v UI renderují v Europe/Prague; rozpočtová okna dál počítá SQL
      # (`date_trunc` na serveru DB) v UTC, takže TZ je neovlivní.
      TZ: Europe/Prague
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL chybí v .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY chybí v .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY chybí v .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL chybí v .env}
      # encryptCredentials (@farm/core) při ukládání připojení v /settings.
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY chybí v .env}
    networks:
    - farmnet
    - agentfarm-supabase_default
    - workernet
    - dokploy-network
    logging: *id002
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    depends_on:
    - orchestrator
    container_name: agentfarm-dashboard
    expose:
    - '3000'
networks:
  farmnet:
    driver: bridge
  workernet:
    name: workernet
    driver: bridge
  agentfarm-supabase_default:
    external: true
  dokploy-network:
    external: true
volumes:
  workspaces: null
  media-tmp: null
