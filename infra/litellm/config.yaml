# =============================================================================
# LiteLLM proxy — PRIMÁR: OpenCode Go (flat $10/měs, 6× hodnota), FALLBACK: přímý DeepSeek.
# Když OpenCode Go narazí na limit ($12/5h, $30/týd, $60/měs → 429/4xx), router
# automaticky přepne na přímé DeepSeek/Kimi API (jako dosud). Tvrdý denní strop drží.
# Model ID u OpenCode Go = holé (deepseek-v4-flash…), endpoint /zen/go/v1 (OpenAI-compat).
# =============================================================================

model_list:
  # ---------- PRIMÁR: OpenCode Go ----------
  - model_name: manager
    litellm_params:
      model: openai/deepseek-v4-pro
      api_key: os.environ/OPENCODE_GO_API_KEY
      api_base: https://opencode.ai/zen/go/v1
    model_info:
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087

  - model_name: worker
    litellm_params:
      model: openai/kimi-k3
      api_key: os.environ/OPENCODE_GO_API_KEY
      api_base: https://opencode.ai/zen/go/v1
    model_info:
      input_cost_per_token: 0.0000006
      output_cost_per_token: 0.0000025

  - model_name: worker-hard
    litellm_params:
      model: openai/kimi-k3
      api_key: os.environ/OPENCODE_GO_API_KEY
      api_base: https://opencode.ai/zen/go/v1
    model_info:
      input_cost_per_token: 0.0000006
      output_cost_per_token: 0.0000025

  - model_name: judge
    litellm_params:
      model: openai/deepseek-v4-pro
      api_key: os.environ/OPENCODE_GO_API_KEY
      api_base: https://opencode.ai/zen/go/v1
    model_info:
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087

  - model_name: cheap
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/OPENCODE_GO_API_KEY
      api_base: https://opencode.ai/zen/go/v1
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  - model_name: media-vlm
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/OPENCODE_GO_API_KEY
      api_base: https://opencode.ai/zen/go/v1
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  # ---------- FALLBACK: přímé DeepSeek/Kimi API (přes limit OpenCode Go) ----------
  - model_name: manager-fallback
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087

  - model_name: worker-fallback
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  - model_name: worker-hard-fallback
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087

  - model_name: judge-fallback
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087

  - model_name: cheap-fallback
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  - model_name: media-vlm-fallback
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - manager: ["manager-fallback"]
    - worker: ["worker-fallback"]
    - worker-hard: ["worker-hard-fallback", "worker-fallback"]
    - judge: ["judge-fallback"]
    - cheap: ["cheap-fallback"]
    - media-vlm: ["media-vlm-fallback"]
  num_retries: 2
  request_timeout: 600
  allowed_fails: 3
  cooldown_time: 60

litellm_settings:
  drop_params: true
  success_callback: ["postgres"]
  failure_callback: ["postgres"]
  # Runaway backstop, NE hlavní brzda. Primár je OpenCode Go = paušál $10/měsíc,
  # takže "cena" sledovaná LiteLLM u něj neodpovídá reálným penězům; skutečné
  # peníze utrácí až DeepSeek fallback a ten hlídá app-level denní strop
  # (profiles.caps_override.dailyCapUsd = $10) + per-projekt daily_cap_usd.
  # Původních $5 byla nejhorší možná brzda: po vyčerpání vracel LiteLLM 402 na
  # VŠECHNO včetně judge, takže se zahazovaly už zaplacené dokončené pokusy
  # (303× "Judge selhal: 402" za jediné odpoledne) a farma dala 3 úspěchy/den.
  max_budget: 25
  budget_duration: 1d

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  allow_user_auth: true
  disable_spend_logs: false
