router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0
  timeout: 180
  allowed_fails: 3
  cooldown_time: 60
litellm_settings:
  drop_params: true
  callbacks:
  - farm_budget_guard.farm_budget_guard
  num_retries: 0
  request_timeout: 180
  max_budget: 0.6
  budget_duration: 1d
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  allow_user_auth: true
  disable_spend_logs: false
