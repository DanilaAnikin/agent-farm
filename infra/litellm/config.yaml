# =============================================================================
# LiteLLM proxy — DeepSeek-only varianta (homelab, jen DEEPSEEK_API_KEY).
# Všechny role (manager/worker/judge/cheap) běží přes DeepSeek V4 (pro/flash).
# Tvrdý denní strop celé farmy = $5.
# =============================================================================

model_list:
  - model_name: manager
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087

  - model_name: worker
    litellm_params:
      model: moonshot/kimi-k3
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: https://api.moonshot.ai/v1
    model_info:
      input_cost_per_token: 0.0000006
      output_cost_per_token: 0.0000025

  - model_name: worker-hard
    litellm_params:
      model: moonshot/kimi-k3
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: https://api.moonshot.ai/v1
    model_info:
      input_cost_per_token: 0.0000006
      output_cost_per_token: 0.0000025

  - model_name: worker-fallback
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  - model_name: judge
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087

  - model_name: cheap
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  # media-vlm role se v čistě-kódovacím režimu nepoužívá; namapováno na DeepSeek flash,
  # aby proxy nevyžadovala ZAI/DASHSCOPE klíče.
  - model_name: media-vlm
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  - model_name: media-vlm-fallback
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - worker: ["worker-fallback"]
    - worker-hard: ["worker", "worker-fallback"]
    - media-vlm: ["media-vlm-fallback"]
  num_retries: 2
  request_timeout: 600
  allowed_fails: 3
  cooldown_time: 60

litellm_settings:
  drop_params: true
  success_callback: ["postgres"]
  failure_callback: ["postgres"]
  max_budget: 5           # tvrdý denní strop CELÉ farmy (USD)
  budget_duration: 1d

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  allow_user_auth: true
  disable_spend_logs: false
