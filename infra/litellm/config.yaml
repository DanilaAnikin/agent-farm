# Active budgeted routing. All paid calls pass the durable PostgreSQL reservation guard.
# Global limits are read from farm_settings: 0.60 USD/day and 20 USD/month.
# Price source checked 2026-09-14: https://api-docs.deepseek.com/quick_start/pricing/
# PEAK rates are deliberately used for conservative budget accounting even off-peak.
# No internal retries/fallbacks: every separately billed attempt must reserve budget.
# Non-thinking tool calls avoid dropping reasoning_content in the OpenCode adapter.
# All aliases use Pro after Flash keepalive stalls observed 2026-09-14; caps unchanged.
model_list:
- model_name: manager
  litellm_params:
    model: deepseek/deepseek-v4-pro
    api_key: os.environ/DEEPSEEK_API_KEY
    api_base: https://api.deepseek.com
    max_tokens: 4096
    timeout: 180
    extra_body:
      thinking:
        type: disabled
  model_info:
    input_cost_per_token: 1.32e-06
    output_cost_per_token: 3.96e-06
    cache_read_input_token_cost: 4.4e-08
